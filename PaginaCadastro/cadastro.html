<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <meta name="author" content="Júlia">
    <meta name="date" content="28.09.26">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cartao">
        <header>
            <img src="logo.png" alt="Logo Kotodama">
        </header>
        <main>
            <h1>Cadastre-se</h1>
            <form id="form-cadastro">
                <div class="campo">
                    <label for="nome">Nome:</label>
                    <input id="nome" type="text" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input id="email" type="email" required>
                </div>

                <div class="campo">
                    <label for="cpf">CPF:</label>
                    <input id="cpf" type="text" inputmode="numeric" maxlength="11" required>
                </div>

                <div class="campo">
                    <label for="endereco">Endereço:</label>
                    <input id="endereco" type="text" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha:</label>
                    <input id="senha" type="password" required>
                </div>

                <div class="campo">
                    <label for="imagem">Imagem:</label>
                    <input id="imagem" name="imagem" type="file" accept="image/*" required>
                </div>

                <button type="submit">Salvar</button>
            </form>
        </main>
        <footer><br>
            <p class="foot">&copy;2026. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
